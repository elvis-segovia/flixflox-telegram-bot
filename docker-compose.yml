services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: always
    env_file: .env      
    volumes:
      - ./telegram-data:/var/lib/telegram-bot-api
    ports:
      # Loopback only: the server exposes the token in the file URLs.
      - "127.0.0.1:8081:8081"
